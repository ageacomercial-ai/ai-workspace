<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>AI Workspace v2</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #0a0a0f; color: #fff; min-height: 100vh; }
        .header { background: #12121a; padding: 16px 24px; border-bottom: 1px solid #2a2a3a; }
        .header h1 { font-size: 20px; color: #6366f1; }
        .nav { background: #12121a; padding: 12px 24px; border-bottom: 1px solid #2a2a3a; display: flex; gap: 8px; flex-wrap: wrap; }
        .nav button { padding: 10px 16px; background: #1a1a25; border: 1px solid #2a2a3a; border-radius: 8px; color: #a0a0b8; cursor: pointer; font-size: 13px; }
        .nav button:hover { border-color: #6366f1; color: #6366f1; }
        .nav button.active { background: rgba(99,102,241,0.1); border-color: #6366f1; color: #6366f1; }
        .container { max-width: 900px; margin: 0 auto; padding: 24px; }
        .section { display: none; }
        .section.active { display: block; }
        label { display: block; margin-bottom: 8px; color: #a0a0b8; font-size: 14px; }
        textarea { width: 100%; height: 180px; background: #1a1a25; border: 2px solid #3a3a4a; border-radius: 8px; padding: 16px; color: #fff; font-size: 15px; resize: vertical; font-family: Arial, sans-serif; }
        textarea:focus { border-color: #6366f1; outline: none; }
        textarea::placeholder { color: #707088; }
        .chips { display: flex; gap: 8px; margin: 12px 0; flex-wrap: wrap; }
        .chip { padding: 8px 14px; background: #1a1a25; border: 1px solid #2a2a3a; border-radius: 20px; color: #a0a0b8; cursor: pointer; font-size: 12px; }
        .chip:hover { border-color: #6366f1; color: #6366f1; }
        .chip.active { background: rgba(99,102,241,0.1); border-color: #6366f1; color: #6366f1; }
        .btn { padding: 12px 24px; background: #6366f1; color: #fff; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; margin-right: 8px; }
        .btn:hover { background: #818cf8; }
        .btn-outline { background: transparent; border: 1px solid #2a2a3a; color: #a0a0b8; }
        .btn-outline:hover { border-color: #6366f1; color: #6366f1; }
        .output { margin-top: 20px; padding: 20px; background: #12121a; border: 1px solid #2a2a3a; border-radius: 8px; min-height: 150px; white-space: pre-wrap; font-size: 14px; line-height: 1.6; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-top: 16px; }
        .split { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .preview-frame { width: 100%; height: 400px; background: #fff; border: 1px solid #2a2a3a; border-radius: 8px; }
        .chat-box { background: #12121a; border: 1px solid #2a2a3a; border-radius: 8px; padding: 16px; margin-top: 16px; max-height: 300px; overflow-y: auto; }
        .chat-msg { margin-bottom: 12px; }
        .chat-msg .name { font-size: 12px; color: #6366f1; margin-bottom: 4px; }
        .chat-msg .text { font-size: 14px; color: #a0a0b8; }
        .row { display: flex; gap: 8px; margin-top: 16px; }
        .row input { flex: 1; padding: 12px; background: #1a1a25; border: 1px solid #2a2a3a; border-radius: 8px; color: #fff; font-size: 14px; }
        .row input:focus { border-color: #6366f1; outline: none; }
    </style>
</head>
<body>
    <div class="header"><h1>AI Workspace v2</h1></div>
    <div class="nav" id="nav">
        <button class="active" data-tab="text">Text & Code</button>
        <button data-tab="site">Site Builder</button>
        <button data-tab="video">Video</button>
        <button data-tab="image">Images</button>
        <button data-tab="chat">Chat</button>
        <button data-tab="editor">Code Editor</button>
    </div>
    <div class="container">
        <div id="text" class="section active">
            <label>O que quer gerar:</label>
            <textarea id="prompt" placeholder="Escreva aqui..."></textarea>
            <div class="chips" id="type-chips">
                <div class="chip active" data-type="text">Text</div>
                <div class="chip" data-type="code">Code</div>
                <div class="chip" data-type="html">HTML/CSS</div>
                <div class="chip" data-type="js">JavaScript</div>
                <div class="chip" data-type="python">Python</div>
                <div class="chip" data-type="sql">SQL</div>
                <div class="chip" data-type="blog">Blog</div>
            </div>
            <button class="btn" id="btn-gerar">Gerar</button>
            <button class="btn btn-outline" id="btn-limpar">Limpar</button>
            <button class="btn btn-outline" id="btn-copiar">Copiar</button>
            <div class="output" id="output">Resultado aparece aqui...</div>
        </div>
        <div id="site" class="section">
            <label>Descreva o site:</label>
            <textarea id="site-prompt" placeholder="Ex: Landing page para barbearia..." style="height:100px"></textarea>
            <button class="btn" id="btn-gerar-site">Gerar Site</button>
            <button class="btn btn-outline" id="btn-export-site">Exportar HTML</button>
            <div class="split" style="margin-top:16px">
                <div><label>Código:</label><textarea id="site-code" style="height:400px;font-family:monospace;font-size:12px"></textarea></div>
                <div><label>Preview:</label><iframe id="preview" class="preview-frame"></iframe></div>
            </div>
        </div>
        <div id="video" class="section">
            <label>Descreva o vídeo:</label>
            <textarea id="video-prompt" placeholder="Ex: Carro em Luanda ao pôr do sol..." style="height:120px"></textarea>
            <button class="btn" id="btn-gerar-video">Gerar Vídeo</button>
            <div class="output" style="text-align:center;padding:60px"><div style="font-size:64px;margin-bottom:16px">🎬</div><div>Vídeo será gerado aqui</div></div>
        </div>
        <div id="image" class="section">
            <label>Descreva a imagem:</label>
            <textarea id="image-prompt" placeholder="Ex: Escritório moderno em Luanda..." style="height:100px"></textarea>
            <button class="btn" id="btn-gerar-img">Gerar Imagem</button>
            <div class="grid"><div style="background:#12121a;border:1px solid #2a2a3a;border-radius:8px;height:180px;display:flex;align-items:center;justify-content:center">🖼️</div><div style="background:#12121a;border:1px solid #2a2a3a;border-radius:8px;height:180px;display:flex;align-items:center;justify-content:center">🖼️</div><div style="background:#12121a;border:1px solid #2a2a3a;border-radius:8px;height:180px;display:flex;align-items:center;justify-content:center">🖼️</div><div style="background:#12121a;border:1px solid #2a2a3a;border-radius:8px;height:180px;display:flex;align-items:center;justify-content:center">🖼️</div></div>
        </div>
        <div id="chat" class="section">
            <div class="chat-box" id="chat-box"><div class="chat-msg"><div class="name">AI</div><div class="text">Olá! Como posso ajudar?</div></div></div>
            <div class="row"><input type="text" id="chat-input" placeholder="Escreva a sua mensagem..."><button class="btn" id="btn-send-chat">Enviar</button></div>
        </div>
        <div id="editor" class="section">
            <label>Editor de Código:</label>
            <textarea id="code-editor" style="height:400px;font-family:monospace;font-size:13px;background:#0a0a0f">// Escreva o código aqui...
function hello() { console.log('Olá Mundo!'); }
hello();</textarea>
            <button class="btn" id="btn-executar">Executar</button>
            <button class="btn btn-outline" id="btn-ai-complete">AI Complete</button>
            <div class="output" id="code-output" style="display:none"></div>
        </div>
    </div>
    <script>
    (function() {
        var currentType = 'text';
        
        // Tab navigation
        document.getElementById('nav').addEventListener('click', function(e) {
            var btn = e.target.closest('button');
            if (!btn) return;
            var tab = btn.getAttribute('data-tab');
            if (!tab) return;
            document.querySelectorAll('.section').forEach(function(s) { s.classList.remove('active'); });
            document.getElementById(tab).classList.add('active');
            document.querySelectorAll('#nav button').forEach(function(b) { b.classList.remove('active'); });
            btn.classList.add('active');
        });
        
        // Type chips
        document.getElementById('type-chips').addEventListener('click', function(e) {
            var chip = e.target.closest('.chip');
            if (!chip) return;
            currentType = chip.getAttribute('data-type') || 'text';
            document.querySelectorAll('#type-chips .chip').forEach(function(c) { c.classList.remove('active'); });
            chip.classList.add('active');
        });
        
        // Generate
        document.getElementById('btn-gerar').addEventListener('click', function() {
            var p = document.getElementById('prompt').value;
            if (!p || !p.trim()) {
                document.getElementById('output').innerText = 'Escreva algo na caixa acima!';
                return;
            }
            var t = {
                text: '# ' + p + '\n\nResposta detalhada...\n\n## Pontos principais\n\n1. Analise\n2. Exemplos\n3. Recomendacoes',
                code: '// ' + p + '\nfunction solution() {\n    // Logica aqui\n    return result;\n}',
                html: '<!DOCTYPE html>\n<html>\n<head><title>' + p + '</title></head>\n<body><h1>' + p + '</h1></body>\n</html>',
                js: '// ' + p + '\nclass App {\n    constructor() { this.init(); }\n    init() { console.log("OK"); }\n}\nnew App();',
                python: '# ' + p + '\nfrom fastapi import FastAPI\napp = FastAPI()\n@app.get("/")\ndef root(): return {"msg": "Ola"}',
                sql: '-- ' + p + '\nCREATE TABLE items (\n    id SERIAL PRIMARY KEY,\n    name VARCHAR(100)\n);',
                blog: '# ' + p + '\n\n## Introducao\n\nArtigo sobre...\n\n## Conteudo\n\nDetalhes...\n\n## Conclusao\n\nResumo.'
            };
            document.getElementById('output').innerText = t[currentType] || t.text;
        });
        
        // Limpar
        document.getElementById('btn-limpar').addEventListener('click', function() {
            document.getElementById('output').innerText = 'Resultado aparece aqui...';
            document.getElementById('prompt').value = '';
        });
        
        // Copiar
        document.getElementById('btn-copiar').addEventListener('click', function() {
            var text = document.getElementById('output').innerText;
            if (navigator.clipboard) {
                navigator.clipboard.writeText(text).then(function() { alert('Copiado!'); });
            } else {
                alert('Copie manualmente: ' + text.substring(0, 50) + '...');
            }
        });
        
        // Site Builder
        document.getElementById('btn-gerar-site').addEventListener('click', function() {
            var p = document.getElementById('site-prompt').value;
            if (!p || !p.trim()) { alert('Descreva o site!'); return; }
            var h = '<!DOCTYPE html>\n<html lang="pt">\n<head>\n<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width, initial-scale=1.0">\n<title>' + p + '</title>\n<style>\n* { margin: 0; padding: 0; box-sizing: border-box; }\nbody { font-family: Arial; background: #0a0a0f; color: #fff; }\n.hero { min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; background: linear-gradient(135deg, #1a1a2e, #16213e); }\nh1 { font-size: 3rem; color: #6366f1; margin-bottom: 20px; }\np { color: #a0a0b8; margin-bottom: 30px; }\n.btn { padding: 14px 32px; background: #6366f1; color: #fff; border: none; border-radius: 8px; cursor: pointer; }\n</style>\n</head>\n<body>\n<section class="hero"><div><h1>' + p + '</h1><p>Site gerado por AI Workspace</p><button class="btn">Saber Mais</button></div></section>\n</body>\n</html>';
            document.getElementById('site-code').value = h;
            document.getElementById('preview').srcdoc = h;
        });
        
        document.getElementById('btn-export-site').addEventListener('click', function() {
            var code = document.getElementById('site-code').value;
            var blob = new Blob([code], {type: 'text/html'});
            var a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'site.html';
            a.click();
        });
        
        // Video
        document.getElementById('btn-gerar-video').addEventListener('click', function() {
            alert('A gerar video...\nModelo: Wan2.1\nTempo: 30-60s');
        });
        
        // Image
        document.getElementById('btn-gerar-img').addEventListener('click', function() {
            alert('A gerar imagens...\n4 variantes');
        });
        
        // Chat
        function sendChat() {
            var input = document.getElementById('chat-input');
            var msg = input.value.trim();
            if (!msg) return;
            var box = document.getElementById('chat-box');
            box.innerHTML += '<div class="chat-msg"><div class="name">Voce</div><div class="text">' + msg + '</div></div>';
            input.value = '';
            setTimeout(function() {
                var r = 'Posso ajudar! Use os paineis acima.';
                if (msg.toLowerCase().indexOf('codigo') !== -1) r = 'Use "Text & Code" > "Code".';
                if (msg.toLowerCase().indexOf('site') !== -1) r = 'Use "Site Builder".';
                if (msg.toLowerCase().indexOf('video') !== -1) r = 'Use "Video".';
                box.innerHTML += '<div class="chat-msg"><div class="name">AI</div><div class="text">' + r + '</div></div>';
                box.scrollTop = box.scrollHeight;
            }, 500);
        }
        document.getElementById('btn-send-chat').addEventListener('click', sendChat);
        document.getElementById('chat-input').addEventListener('keypress', function(e) { if (e.key === 'Enter') sendChat(); });
        
        // Editor
        document.getElementById('btn-executar').addEventListener('click', function() {
            var code = document.getElementById('code-editor').value;
            var out = document.getElementById('code-output');
            out.style.display = 'block';
            try { eval(code); out.innerText = 'OK!'; } catch(e) { out.innerText = 'Erro: ' + e.message; }
        });
        document.getElementById('btn-ai-complete').addEventListener('click', function() {
            document.getElementById('code-editor').value += '\n\n// AI sugestao...';
        });
    })();
    </script>
</body>
</html>
